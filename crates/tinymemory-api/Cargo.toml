[package]
name = "tinymemory-api"
description = "The TinyMemory core contract: recall, fetch and store over typed memory items"
readme = "README.md"
keywords = ["memory", "agent", "llm", "retrieval"]
categories = ["database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The contract an engine compiles against. It performs no I/O and links no
# runtime, storage engine or HTTP stack; anything heavier belongs in
# `tinymemory-integrations`.
[dependencies]
# `MemoryEngine` is an object-safe trait of `async fn`s.
async-trait = "0.1"
# `MemoryMeta::observed_at`, `Turn::at` and the filter window are UTC instants.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# IANA zones for `TimeHint`: validates a hint's zone before an engine sends it
# (CortexDB refuses a non-IANA zone) and reads `observed_at` as a local day.
chrono-tz = "0.10"
# Every request, response and item crosses a host boundary as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `StoreItem::fingerprint`: the content-derived identity engines use to turn an
# identical retry into a replay rather than a duplicate.
sha2 = "0.11"
# The crate-wide `Error`.
thiserror = "2"
# Pure local identification-risk matching; no runtime or engine dependency.
regex = { version = "1", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
# Opt-in local classification/redaction; the default engine contract stays regex-free.
local-safety = ["dep:regex", "dep:log"]
# `conformance::run`, the behavioural suite every engine must pass, and
# `conformance::ReferenceEngine`, an in-memory engine that passes it. Adds no
# dependency: both are written against the contract alone.
conformance = []

[[test]]
name = "local_safety_no_logger"
required-features = ["local-safety"]

[[test]]
name = "safety_contract"
required-features = ["local-safety"]

[[test]]
name = "conformance_reference"
required-features = ["conformance"]

[lints]
workspace = true
